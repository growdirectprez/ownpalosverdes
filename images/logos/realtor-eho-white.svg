<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 0 260 74" fill="none" role="img" aria-label="REALTOR and Equal Housing Opportunity">
  <!-- ── REALTOR mark ── -->
  <rect x="3" y="3" width="46" height="46" stroke="#ffffff" stroke-width="3"/>
  <text x="26" y="39" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#ffffff">R</text>
  <text x="26" y="66" text-anchor="middle" font-family="'Outfit', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1.2" fill="#ffffff">REALTOR&#174;</text>

  <!-- ── EQUAL HOUSING OPPORTUNITY mark ── -->
  <!-- house outline: roof + body -->
  <path d="M108 5 L138 27 L138 49 L78 49 L78 27 Z" stroke="#ffffff" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <!-- equals sign -->
  <rect x="93" y="31" width="30" height="4.5" fill="#ffffff"/>
  <rect x="93" y="40" width="30" height="4.5" fill="#ffffff"/>
  <text x="152" y="30" font-family="'Outfit', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="0.6" fill="#ffffff">EQUAL HOUSING</text>
  <text x="152" y="42" font-family="'Outfit', Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="0.6" fill="#ffffff">OPPORTUNITY</text>
</svg>
